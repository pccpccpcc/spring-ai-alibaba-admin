name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 允许在 GitHub 页面手动触发，便于不改代码也能重跑
  workflow_dispatch:

# 同一分支的并发推送只保留最新一次运行，省额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test (JDK 21)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 起真实中间件（MySQL + Redis + RocketMQ），集成测试连它们。
      # 详见 docker/middleware/docker-compose.ci.yml 与 docs/testing-guide.md。
      - name: Start middleware (MySQL / Redis / RocketMQ)
        working-directory: docker/middleware
        run: |
          docker compose -f docker-compose.ci.yml up -d mysql redis rmq_namesrv rmq_broker rmq_proxy
          # 等待长驻服务健康
          docker compose -f docker-compose.ci.yml ps --format json | jq -r '.Service + " " + .Health' || true
          # 一次性创建 RocketMQ topic 与消费组（脚本内部会自旋等待 broker 就绪）
          docker compose -f docker-compose.ci.yml run --rm init-topic

      - name: Show middleware status
        working-directory: docker/middleware
        run: docker compose -f docker-compose.ci.yml ps

      - name: Build & test
        env:
          # 把连接参数切到 CI 容器，RealMiddlewareSpringBootTest 通过 @DynamicPropertySource 读取
          TEST_MYSQL_HOST: 127.0.0.1
          TEST_MYSQL_PORT: 3306
          TEST_MYSQL_DATABASE: admin_test
          TEST_MYSQL_USER: admin
          TEST_MYSQL_PASSWORD: admin
          TEST_REDIS_HOST: 127.0.0.1
          TEST_REDIS_PORT: 6379
          TEST_ROCKETMQ_ENDPOINTS: 127.0.0.1:18080
        run: mvn -B -ntp test

      # 无论测试是否通过，都把报告留作 artifact，便于排障
      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/**'
          if-no-files-found: ignore
          retention-days: 7
